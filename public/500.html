<!doctype html>

<html lang="en">

  <head>

    <title>We're sorry, but something went wrong (500 Internal Server Error)</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: linear-gradient(180deg, #fffdfc 0%, #fbeeee 100%);
        color: #4a2c33;
        display: grid;
        font-family: "M PLUS Rounded 1c", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Roboto, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        -webkit-font-smoothing: antialiased;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-text-size-adjust: 100%;
      }

      a {
        background: #d3667a;
        border-radius: 999px;
        color: #fff;
        display: inline-block;
        font-weight: 700;
        padding: 0.75em 1.75em;
        text-decoration: none;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      a:hover {
        background: #c2536a;
        transform: translateY(-1px);
      }

      main {
        display: grid;
        gap: 1.5em;
        padding: 2em;
        place-items: center;
        text-align: center;
      }

      main img {
        border-radius: 1.5em;
        box-shadow: 0 12px 36px rgba(74, 44, 51, 0.18);
        max-width: min(90vw, 640px);
        width: 100%;
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/500.html -->

    <main>
      <img src="/500.jpeg" alt="A sad cartoon sparrow among cherry blossoms with smoke rising. Error 500: Internal server error. Looks like we had a little meltdown, sorry about that.">
      <a href="/">Take me home</a>
    </main>

  </body>

</html>
